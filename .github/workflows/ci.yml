name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full-matrix:
        description: "Test all supported Python versions (3.11-3.14)"
        type: boolean
        default: false
      run-heavy:
        description: "Include heavy tests (accuracy/convergence checks)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      full-matrix:
        type: boolean
        default: false
      run-heavy:
        type: boolean
        default: false
      concurrency-key:
        # Set by a caller that must never be cancelled (see `concurrency` below).
        type: string
        default: ""
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  # release.yml passes an explicit run-scoped `concurrency-key`, which is unique
  # per run and so is never cancelled by anything else.
  #
  # Defence in depth rather than a fix for a known bug: a called workflow sees
  # the *caller's* `github.workflow`, so release runs already group separately
  # ("Release-..." vs "CI-..."). That is a subtle guarantee to rest a release on
  # -- renaming either workflow is enough to collide them -- so state it
  # explicitly instead.
  #
  # `inputs.concurrency-key ||` relies on an unset/empty input being falsy in
  # GitHub expressions -- the same quirk called out on the pytest step below,
  # used deliberately here.
  group: ${{ inputs.concurrency-key || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ inputs.concurrency-key == '' && (github.event_name == 'push' || github.event_name == 'pull_request') }}

jobs:
  checks:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      # The pyright hook in .pre-commit-config.yaml is `language: system`, so it
      # needs the project's dependencies importable to resolve jax/numpy/etc.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tests,benchmarks,viz]"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # The light suite takes ~4 min on macOS and ~4-6 min on Ubuntu, so this is
    # pure headroom. It exists because Ubuntu runners used to die mid-suite on
    # memory (see the `-n 2` below): as well as failing outright, they could
    # wedge for 54-56 minutes before GitHub's 360-minute default reaped them,
    # which on a 10-cell release matrix is hours of runner time per hang.
    timeout-minutes: 45
    env:
      # glibc allocator tuning, aimed at the same memory problem as `-n 2`:
      # cap the per-thread arenas an xdist worker's XLA thread pool spreads its
      # free chunks across, and stop glibc raising its mmap threshold (it does
      # so, up to 32 MB, whenever an mmap'd block is freed, after which large
      # XLA buffers come from the heap and can only be returned when a whole
      # page falls empty).
      #
      # Kept as a cheap hedge rather than a demonstrated win: they went in
      # alongside `-n 2`, so their individual contribution was never isolated,
      # and CI has been green with them set. All three are ignored off glibc,
      # so the macOS cells are unaffected.
      MALLOC_ARENA_MAX: "2"
      MALLOC_MMAP_THRESHOLD_: "131072"
      MALLOC_TRIM_THRESHOLD_: "131072"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Currently doesn't work on pypy due to dependencies.
        python-version: ${{ fromJSON(inputs.full-matrix
          && '["3.11","3.12","3.13","3.14"]'
          || '["3.12","3.14"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tests,benchmarks,viz]"

      # tests/conftest.py points JAX's persistent compilation cache here.
      # jaxlib upgrades invalidate entries internally, so a stale restore is
      # safe -- it just yields fewer hits.
      #
      # Restore and save are split so that only pushes to main write entries.
      # A single `actions/cache` step with `github.sha` in the key never hits
      # exactly, so every commit on every branch would store a fresh copy;
      # multiplied by the matrix, those hundreds-of-MB entries evict each other
      # out of the 10 GB per-repo limit and the cache stops paying for itself.
      # PR runs restore from main's entry instead (their own writes would be
      # scoped to the PR and unusable elsewhere anyway).
      - uses: actions/cache/restore@v5
        id: jax-cache
        with:
          path: .pytest_cache/jax_cache
          key: jax-${{ runner.os }}-${{ matrix.python-version }}-${{ github.sha }}
          restore-keys: |
            jax-${{ runner.os }}-${{ matrix.python-version }}-

      # Ubuntu runs the light suite with two xdist workers instead of
      # pytest.ini's `-n auto` (which picks 4 here), because four of them do
      # not fit in a 16 GB runner. Cells were dying mid-suite on memory with
      # zero test failures -- sometimes an abrupt cancel, sometimes a wedge
      # that sat there until the runner was reaped 54 minutes later.
      #
      # Halving the workers does not halve the total: most of the memory is
      # work-proportional, so it just moves to the workers that remain (they go
      # from ~4 GB each to ~6.5 GB). What it removes is one full copy of the
      # per-process baseline, and that was the difference between fitting and
      # not. Four workers needed ~15.9 GB plus 3 GB of swap and thrashed to
      # death; two need ~13.8 GB with no swap at all. Ubuntu also got *faster*
      # -- 4-6 min against the 9-11 it took while swapping.
      #
      # Headroom is ~2.2 GB, and it will erode as the suite grows, since the
      # dominant term scales with tests-per-worker. The next lever is splitting
      # the run into two pytest invocations: fresh processes reset that term.
      #
      # macOS keeps `-n auto` -- the same suite peaks at 2.35 GB there.
      #
      # `--timeout` is unrelated to memory and stays regardless: it turns a
      # wedged test into a thread dump and a normal failure rather than a
      # silent job that burns an hour. 600s is ~15x the slowest light test.
      - name: Test with pytest
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            set -- -n 2
          fi
          pytest "$@" --timeout=600 --timeout-method=thread \
            -m "not heavy" --cov --junitxml=junit.xml -o junit_family=legacy

      # Not gated on the tests passing: the compilation cache is still valid and
      # worth keeping when a test fails. `cache-hit` is only 'true' on an exact
      # key match (a re-run of the same sha), where saving would just warn.
      - uses: actions/cache/save@v5
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.jax-cache.outputs.cache-hit != 'true' }}
        with:
          path: .pytest_cache/jax_cache
          key: jax-${{ runner.os }}-${{ matrix.python-version }}-${{ github.sha }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  heavy:
    name: Heavy tests
    # Accuracy and convergence results do not vary by interpreter or OS, so this
    # runs on one cell rather than every matrix combination -- the same coverage
    # for a tenth of the runner time. `inputs.run-heavy` is unset (and so falsy)
    # on push and pull_request, which skips the job.
    if: ${{ inputs.run-heavy }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Same reasoning as the `test` job above. Note this job keeps `-n auto`:
      # it has never been seen to run out of memory, and it is only reached on
      # the release path, where halving its workers would push it towards the
      # 120-minute cap. If it ever dies the way the light cells did, `-n 2` is
      # the knob.
      MALLOC_ARENA_MAX: "2"
      MALLOC_MMAP_THRESHOLD_: "131072"
      MALLOC_TRIM_THRESHOLD_: "131072"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tests,benchmarks,viz]"

      - uses: actions/cache/restore@v5
        id: jax-cache
        with:
          path: .pytest_cache/jax_cache
          key: jax-heavy-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            jax-heavy-${{ runner.os }}-

      - name: Test with pytest
        run: pytest -m heavy --cov --junitxml=junit.xml -o junit_family=legacy

      - uses: actions/cache/save@v5
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.jax-cache.outputs.cache-hit != 'true' }}
        with:
          path: .pytest_cache/jax_cache
          key: jax-heavy-${{ runner.os }}-${{ github.sha }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: heavy
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: heavy

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata
        run: twine check --strict dist/*
      - name: Smoke-test the wheel
        # Install into a clean venv (not the build env) so a missing runtime
        # dependency or a packaging mistake surfaces here rather than on PyPI.
        # The import must run from outside the checkout: with the repo as the
        # working directory, `import pypomp` resolves to ./pypomp and the test
        # passes without ever touching the wheel.
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/python -c "import pypomp; print(pypomp.__version__, pypomp.__file__)"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install docs dependencies
        # Mirrors .readthedocs.yaml: docs-only tooling from
        # docs/requirements.txt, runtime dependencies from pyproject.toml. Keep
        # the two install paths in step so CI cannot pass while RTD fails.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt
          python -m pip install -e .
      - name: Build HTML
        # -W turns warnings into errors so broken cross-references and malformed
        # docstring markup fail here instead of silently rendering wrong.
        # --keep-going reports every warning in one run rather than stopping at
        # the first.
        run: sphinx-build -W --keep-going -b html docs/source docs/build/html
