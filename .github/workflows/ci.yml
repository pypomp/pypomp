name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full-matrix:
        description: "Test all supported Python versions (3.11-3.14)"
        type: boolean
        default: false
      run-heavy:
        description: "Include heavy tests (accuracy/convergence checks)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      full-matrix:
        type: boolean
        default: false
      run-heavy:
        type: boolean
        default: false
      concurrency-key:
        # Set by a caller that must never be cancelled (see `concurrency` below).
        type: string
        default: ""
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  # release.yml passes an explicit run-scoped `concurrency-key`, which is unique
  # per run and so is never cancelled by anything else.
  #
  # Defence in depth rather than a fix for a known bug: a called workflow sees
  # the *caller's* `github.workflow`, so release runs already group separately
  # ("Release-..." vs "CI-..."). That is a subtle guarantee to rest a release on
  # -- renaming either workflow is enough to collide them -- so state it
  # explicitly instead.
  #
  # `inputs.concurrency-key ||` relies on an unset/empty input being falsy in
  # GitHub expressions -- the same quirk called out on the pytest step below,
  # used deliberately here.
  group: ${{ inputs.concurrency-key || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ inputs.concurrency-key == '' && (github.event_name == 'push' || github.event_name == 'pull_request') }}

jobs:
  checks:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      # The pyright hook in .pre-commit-config.yaml is `language: system`, so it
      # needs the project's dependencies importable to resolve jax/numpy/etc.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tests,benchmarks,viz]"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # The light suite takes ~4 min on macOS and, at the `-n 2` set below,
    # ~20 min on Ubuntu, so this is still headroom. It exists because Ubuntu
    # runners have been dying mid-suite ("The runner has received a shutdown
    # signal") and wedging for 54-56 minutes before GitHub's 360-minute default
    # reaped them -- on a 10-cell release matrix that is hours of runner time
    # per hang.
    timeout-minutes: 45
    env:
      # Secondary to the `-n 2` below, and unproven -- the sampler output will
      # say whether they are worth keeping. All three are ignored off glibc, so
      # the macOS cells are unaffected.
      #
      # glibc gives each thread its own arena and frees back into whichever one
      # an allocation came from, so a process with many threads (an xdist
      # worker running an XLA thread pool) spreads its free chunks thin.
      MALLOC_ARENA_MAX: "2"
      # glibc *raises* its mmap threshold, up to 32 MB, every time an mmap'd
      # block is freed. Once that has happened, large XLA buffers come from the
      # heap instead and free() can only return them if the whole page is
      # empty. Pinning the threshold disables that adaptation, so big
      # allocations keep going to mmap and are handed straight back on free.
      MALLOC_MMAP_THRESHOLD_: "131072"
      MALLOC_TRIM_THRESHOLD_: "131072"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Currently doesn't work on pypy due to dependencies.
        python-version: ${{ fromJSON(inputs.full-matrix
          && '["3.11","3.12","3.13","3.14"]'
          || '["3.12","3.14"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tests,benchmarks,viz]"

      # tests/conftest.py points JAX's persistent compilation cache here.
      # jaxlib upgrades invalidate entries internally, so a stale restore is
      # safe -- it just yields fewer hits.
      #
      # Restore and save are split so that only pushes to main write entries.
      # A single `actions/cache` step with `github.sha` in the key never hits
      # exactly, so every commit on every branch would store a fresh copy;
      # multiplied by the matrix, those hundreds-of-MB entries evict each other
      # out of the 10 GB per-repo limit and the cache stops paying for itself.
      # PR runs restore from main's entry instead (their own writes would be
      # scoped to the PR and unusable elsewhere anyway).
      - uses: actions/cache/restore@v5
        id: jax-cache
        with:
          path: .pytest_cache/jax_cache
          key: jax-${{ runner.os }}-${{ matrix.python-version }}-${{ github.sha }}
          restore-keys: |
            jax-${{ runner.os }}-${{ matrix.python-version }}-

      # Diagnostics for the Ubuntu runner deaths. Those jobs vanish mid-suite
      # with zero test failures, in two shapes: an abrupt "The operation was
      # canceled", or a wedge -- the pytest step stops producing output and sits
      # there until "The runner has received a shutdown signal" (54 minutes, in
      # run 30492815897). macOS runs the same 609 tests clean every time, so it
      # is the Linux VM going away, not a test.
      #
      # Every occurrence so far has landed in the last ~30 tests, which is where
      # `--dist=loadfile` piles up the slow `*_dpop_train` files: locally, total
      # RSS across the four workers sits near 2 GB for the whole run and then
      # spikes to ~5 GB in exactly that window. That is nowhere near the
      # runner's 16 GB, so this samples the real thing rather than guessing.
      #
      # `[res]` lines go to the same log as pytest, so whatever the last sample
      # before the VM dies shows -- memory, swap, disk, load -- is the answer.
      # `-v` names each test as it finishes, pinning down what was in flight.
      # `--timeout` converts a wedge into a thread dump plus a normal failure
      # instead of a silent job that has to be reaped.
      #
      # All three are temporary; drop them once the cause is known.
      - name: Test with pytest
        run: |
          # Runs in a subshell, so `set +e` is local to it: a hiccup in any of
          # these probes must not take the step down with it.
          sample_resources() {
            set +e
            while :; do
              printf '[res] %s ' "$(date -u +%H:%M:%S)"
              free -m | awk '/^Mem:/  {printf "mem_used=%sM mem_avail=%sM ", $3, $7}
                             /^Swap:/ {printf "swap_used=%sM ", $3}'
              df -Pm . | awk 'NR==2 {printf "disk_avail=%sM ", $4}'
              printf 'load=%s' "$(cut -d' ' -f1-3 /proc/loadavg)"
              ps -eo rss=,comm= --sort=-rss | head -n 3 |
                awk '{printf " | %s %dM", $2, $1/1024}'
              echo
              sleep 3
            done
          }

          if [ "$RUNNER_OS" = Linux ]; then
            sample_resources &
            sampler=$!
            trap 'kill "$sampler" 2>/dev/null || true' EXIT
            # `-n 2` instead of pytest.ini's `-n auto` (which picks 4 here).
            #
            # Each worker plateaus near 4 GB and *stays* there -- 4181, 4179,
            # 4179, 4180, 4179 MB across five minutes in run 30577110014 -- so
            # this is a steady-state working set, not a leak, and the total
            # scales with the worker count. Four of them need ~15.5 GB of a
            # 16 GB runner, which is why the cells were coin-flipping: 3.14
            # finished that run with 1107 MB to spare while 3.12 died with 25 MB.
            # Two workers need ~9 GB and leave real headroom.
            #
            # macOS keeps `-n auto`; the same suite peaks at 2.35 GB there.
            # 600s is ~15x the slowest light test but well under the wedge.
            set -- -n 2 -v --timeout=600 --timeout-method=thread
          fi
          pytest "$@" -m "not heavy" --cov --junitxml=junit.xml -o junit_family=legacy

      # Not gated on the tests passing: the compilation cache is still valid and
      # worth keeping when a test fails. `cache-hit` is only 'true' on an exact
      # key match (a re-run of the same sha), where saving would just warn.
      - uses: actions/cache/save@v5
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.jax-cache.outputs.cache-hit != 'true' }}
        with:
          path: .pytest_cache/jax_cache
          key: jax-${{ runner.os }}-${{ matrix.python-version }}-${{ github.sha }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  heavy:
    name: Heavy tests
    # Accuracy and convergence results do not vary by interpreter or OS, so this
    # runs on one cell rather than every matrix combination -- the same coverage
    # for a tenth of the runner time. `inputs.run-heavy` is unset (and so falsy)
    # on push and pull_request, which skips the job.
    if: ${{ inputs.run-heavy }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Same reasoning as the `test` job above.
      MALLOC_ARENA_MAX: "2"
      MALLOC_MMAP_THRESHOLD_: "131072"
      MALLOC_TRIM_THRESHOLD_: "131072"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tests,benchmarks,viz]"

      - uses: actions/cache/restore@v5
        id: jax-cache
        with:
          path: .pytest_cache/jax_cache
          key: jax-heavy-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            jax-heavy-${{ runner.os }}-

      - name: Test with pytest
        run: pytest -m heavy --cov --junitxml=junit.xml -o junit_family=legacy

      - uses: actions/cache/save@v5
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.jax-cache.outputs.cache-hit != 'true' }}
        with:
          path: .pytest_cache/jax_cache
          key: jax-heavy-${{ runner.os }}-${{ github.sha }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: heavy
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: heavy

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata
        run: twine check --strict dist/*
      - name: Smoke-test the wheel
        # Install into a clean venv (not the build env) so a missing runtime
        # dependency or a packaging mistake surfaces here rather than on PyPI.
        # The import must run from outside the checkout: with the repo as the
        # working directory, `import pypomp` resolves to ./pypomp and the test
        # passes without ever touching the wheel.
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/python -c "import pypomp; print(pypomp.__version__, pypomp.__file__)"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install docs dependencies
        # Mirrors .readthedocs.yaml: docs-only tooling from
        # docs/requirements.txt, runtime dependencies from pyproject.toml. Keep
        # the two install paths in step so CI cannot pass while RTD fails.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt
          python -m pip install -e .
      - name: Build HTML
        # -W turns warnings into errors so broken cross-references and malformed
        # docstring markup fail here instead of silently rendering wrong.
        # --keep-going reports every warning in one run rather than stopping at
        # the first.
        run: sphinx-build -W --keep-going -b html docs/source docs/build/html
