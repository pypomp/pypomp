name: Publish to PyPI

# Invoked only by release.yml, after the release-approval gate. Keep this
# filename stable: PyPI's trusted-publisher config is registered against it,
# and renaming would break publishing until that's updated on pypi.org.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref (tag) to build and publish'
        required: true
        type: string

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pypomp/

    permissions:
      id-token: write  # required for trusted publishing
      contents: read   # required for checkout

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install build dependencies
      run: python -m pip install --upgrade pip build

    - name: Build a binary wheel and a source tarball
      run: python -m build

    - name: Publish package to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
