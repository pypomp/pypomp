# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

# Build documentation in the "docs/source" directory with Sphinx
sphinx:
   configuration: docs/source/conf.py

# Declare the Python requirements required to build your documentation
# See https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html
#
# docs/requirements.txt carries docs-only tooling; the package itself (and so
# its runtime dependencies) comes from pyproject.toml via the path install
# below. Listing the runtime dependencies here by hand instead lets them drift
# from pyproject.toml -- which had already happened, with `cloudpickle` missing.
python:
   install:
   - requirements: docs/requirements.txt
   - method: pip
     path: .
