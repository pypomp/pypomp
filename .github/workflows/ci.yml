name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full-matrix:
        description: "Test all supported Python versions (3.12-3.14)"
        type: boolean
        default: false
      run-heavy:
        description: "Include heavy tests (accuracy/convergence checks)"
        type: boolean
        default: false
      run-cpu-scaling:
        description: "Run the CPU parallel-scaling timings (needs an idle runner)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      full-matrix:
        type: boolean
        default: false
      run-heavy:
        type: boolean
        default: false
      run-cpu-scaling:
        type: boolean
        default: false
      concurrency-key:
        # Set by a caller that must never be cancelled (see `concurrency` below).
        type: string
        default: ""
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  # Group runs by explicit concurrency key if provided, or by (workflow, ref).
  # Cancel in-progress push/PR runs unless a custom concurrency key is set.
  group: ${{ inputs.concurrency-key || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ inputs.concurrency-key == '' && (github.event_name == 'push' || github.event_name == 'pull_request') }}

jobs:
  checks:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      # Pre-commit uses system pyright; dependencies must be installed to resolve imports.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tests,benchmarks,viz]"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Prevent wedged jobs from burning runner time on OOM or hangs.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Currently doesn't work on pypy due to dependencies.
        python-version: ${{ fromJSON(inputs.full-matrix
          && '["3.12","3.13","3.14"]'
          || '["3.12","3.14"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tests,benchmarks,viz]"

      # JAX compilation-cache entries are keyed on the CPU's instruction set,
      # so runners with different CPUs (e.g. with/without AVX-512) cannot share
      # them. Key the cache by CPU model so each lineage stays warm.
      - name: CPU tag
        id: cpu
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            model=$(lscpu | sed -n 's/^Model name: *//p')
          else
            model=$(sysctl -n machdep.cpu.brand_string)
          fi
          echo "tag=$(echo "$model" | tr -cs 'A-Za-z0-9' '-' | sed 's/-$//')" >> "$GITHUB_OUTPUT"

      # Restore JAX compilation cache from main (restored entries are scoped to main to save cache space).
      # No fallback to another CPU's cache: its entries never hit here, and
      # every extra entry slows each cache write (see tools/prune_jax_cache.py).
      - uses: actions/cache/restore@v5
        id: jax-cache
        with:
          path: .pytest_cache/jax_cache
          key: jax-${{ runner.os }}-${{ matrix.python-version }}-${{ steps.cpu.outputs.tag }}-${{ github.sha }}
          restore-keys: |
            jax-${{ runner.os }}-${{ matrix.python-version }}-${{ steps.cpu.outputs.tag }}-
      - name: Record cache start time
        run: echo "JAX_CACHE_SINCE_NS=$(python -c 'import time; print(time.time_ns())')" >> "$GITHUB_ENV"

      # Runner speed varies several-fold between jobs; record the hardware so
      # slow runs can be matched against it.
      - name: Runner hardware
        if: runner.os == 'Linux'
        run: |
          lscpu | grep -E '^(Model name|CPU\(s\)|Thread\(s\) per core)'
          grep -qw avx512f /proc/cpuinfo && echo "avx512f: yes" || echo "avx512f: no"
          free -m
          python -c "import jax, jaxlib; print('jax', jax.__version__, 'jaxlib', jaxlib.__version__)"

      # Limit Linux to 2 workers to fit in runner memory (4 workers causes OOM).
      # glibc keeps freed arenas per thread, which inflates RSS enough on the
      # Linux runners to swap or OOM; capping arenas keeps memory flat.
      # The step timeout sits below the job's so the diagnostics step still runs.
      - name: Test with pytest
        timeout-minutes: 65
        env:
          MALLOC_ARENA_MAX: 2
          PYPOMP_TEST_DIAG_LOG: ${{ github.workspace }}/test-modules.log
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            set -- -n 2
            vmstat -t 60 > vmstat.log 2>&1 &
          fi
          pytest "$@" --timeout=600 --timeout-method=thread \
            -m "not heavy" --cov --junitxml=junit.xml -o junit_family=legacy

      # Per-module wall/CPU time, compile-cache hits/misses and peak RSS per
      # worker, plus system CPU steal and swap from vmstat.
      # A step timeout leaves the xdist workers running and writing to the
      # compilation cache, which makes the cache save's tar fail; stop them.
      - name: Test diagnostics
        if: always()
        run: |
          pkill python || true
          for _ in $(seq 30); do pgrep python > /dev/null || break; sleep 1; done
          pkill -KILL python || true
          cat test-modules.log 2>/dev/null || echo "no module log"
          cat vmstat.log 2>/dev/null || true

      # Save updated JAX compilation cache on main pushes, even if tests fail,
      # keeping only the entries this run used.
      - name: Prune JAX cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.jax-cache.outputs.cache-hit != 'true' }}
        run: python tools/prune_jax_cache.py .pytest_cache/jax_cache "$JAX_CACHE_SINCE_NS"
      - uses: actions/cache/save@v5
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.jax-cache.outputs.cache-hit != 'true' }}
        with:
          path: .pytest_cache/jax_cache
          key: jax-${{ runner.os }}-${{ matrix.python-version }}-${{ steps.cpu.outputs.tag }}-${{ github.sha }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  heavy:
    name: Heavy tests
    # Opt-in heavy suite runs on a single cell since accuracy/convergence results are OS/Python agnostic.
    if: ${{ inputs.run-heavy }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tests,benchmarks,viz]"

      - name: CPU tag
        id: cpu
        run: |
          echo "tag=$(lscpu | sed -n 's/^Model name: *//p' | tr -cs 'A-Za-z0-9' '-' | sed 's/-$//')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v5
        id: jax-cache
        with:
          path: .pytest_cache/jax_cache
          key: jax-heavy-${{ runner.os }}-${{ steps.cpu.outputs.tag }}-${{ github.sha }}
          restore-keys: |
            jax-heavy-${{ runner.os }}-${{ steps.cpu.outputs.tag }}-
      - name: Record cache start time
        run: echo "JAX_CACHE_SINCE_NS=$(python -c 'import time; print(time.time_ns())')" >> "$GITHUB_ENV"

      - name: Test with pytest
        run: pytest -m heavy --cov --junitxml=junit.xml -o junit_family=legacy

      - name: Prune JAX cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.jax-cache.outputs.cache-hit != 'true' }}
        run: python tools/prune_jax_cache.py .pytest_cache/jax_cache "$JAX_CACHE_SINCE_NS"
      - uses: actions/cache/save@v5
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.jax-cache.outputs.cache-hit != 'true' }}
        with:
          path: .pytest_cache/jax_cache
          key: jax-heavy-${{ runner.os }}-${{ steps.cpu.outputs.tag }}-${{ github.sha }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: heavy
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: heavy

  cpu-scaling:
    name: CPU parallel scaling
    # Opt-in CPU scaling benchmarks (sensitive to runner load/throttling).
    if: ${{ inputs.run-cpu-scaling }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[tests,benchmarks,viz]"

      - name: Report available cores
        # Log CPU core count for benchmarking context.
        run: nproc

      # Run scaling tests sequentially without coverage to ensure accurate wall-clock timing.
      - name: Run CPU scaling tests
        env:
          PYPOMP_CPU_SCALING: "1"
        run: |
          pytest tests/test_cpu_parallel -n 0 -s \
            --timeout=1200 --timeout-method=thread

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata
        run: twine check --strict dist/*
      - name: Smoke-test the wheel
        # Install wheel into clean venv and test import outside source tree.
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --upgrade pip
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/python -c "import pypomp; print(pypomp.__version__, pypomp.__file__)"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - name: Install docs dependencies
        # Mirror .readthedocs.yaml dependencies.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt
          python -m pip install -e .
      - name: Build HTML
        # Fail on warnings (-W) and report all issues (--keep-going).
        run: sphinx-build -W --keep-going -b html docs/source docs/build/html
