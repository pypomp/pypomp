[pytest]
testpaths = tests
addopts = -n auto --dist=loadfile --durations=10
markers =
    heavy: tests that take a long time to run (e.g. accuracy/convergence checks)

filterwarnings =
    ignore:.*dpop.* is experimental.*:FutureWarning
    # Ignore non-fatal JAX compilation cache warnings caused by concurrent file access during parallel xdist test execution
    ignore:.*compilation cache entry.*:UserWarning
    # Ignore NumPy timedelta deprecation warning from mizani/plotnine
    ignore:.*'generic' unit for NumPy timedelta is deprecated.*:DeprecationWarning
